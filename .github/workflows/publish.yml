# .github/workflows/publish.yml
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = auto ci-YYYYMMDD-HHMMSS)"
        type: string
        default: ""
      mode:
        type: choice
        options: [full, quick]
        default: full
      optimize:
        type: choice
        options: [Debug, ReleaseFast, ReleaseSafe, ReleaseSmall]
        default: ReleaseFast
      deep_wasm:
        type: boolean
        default: true
      engine:
        type: choice
        options: ["", godot, godot_4_5_1, redot, rex]
        default: ""

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build + GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # free, built-in; OK here (not in if:)
        run: |
          set -eux
          MODE="${{ inputs.mode || 'full' }}"
          OPTIMIZE="${{ inputs.optimize || 'ReleaseFast' }}"
          ARGS=("$MODE" "-Doptimize=${OPTIMIZE}" --publish)

          if [ "${{ inputs.deep_wasm || 'true' }}" = "true" ]; then
            ARGS+=(deep-wasm)
          fi

          ENGINE="${{ inputs.engine || '' }}"
          if [ -n "$ENGINE" ]; then
            ARGS+=("--engine=${ENGINE}")
          fi

          # Tag: workflow input, or git tag name on tag push
          TAG="${{ inputs.tag || '' }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -n "$TAG" ]; then
            ARGS+=("--tag=${TAG}")
          fi

          if nix eval --raw .#devShells.x86_64-linux.ci >/dev/null 2>&1; then
            nix develop .#ci --command roc run scripts/ci.roc -- "${ARGS[@]}"
          else
            nix develop --command roc run scripts/ci.roc -- "${ARGS[@]}"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-out-${{ github.run_id }}
          path: bundle-out/
          if-no-files-found: warn
          retention-days: 14
