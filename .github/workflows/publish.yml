# .github/workflows/publish.yml
name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Empty = auto ci-YYYYMMDD-HHMMSS"
        required: false
        default: ""
      mode:
        description: "CI mode"
        type: choice
        options:
          - full
          - quick
        default: full

permissions:
  contents: write   # gh release create + upload

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      # Prefer a real binary cache for the flake (see notes below).
      - uses: cachix/cachix-action@v16
        if: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}
        with:
          name: ${{ vars.CACHIX_CACHE_NAME || 'godot-roc' }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Push new paths after the job so the next run is fast.
          pushFilter: /nix/store

      # Fallback / supplement if you still want Magic Nix Cache.
      - uses: DeterminateSystems/magic-nix-cache-action@main
        if: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Build matrix + publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: override tag from workflow_dispatch
          PUBLISH_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eux
          MODE="${{ inputs.mode || 'full' }}"
          TAG_ARGS=()
          # On tag push, github.ref_name is v1.2.3; on dispatch use input or empty (ci auto-tag).
          if [ -n "${PUBLISH_TAG:-}" ] && [[ "$PUBLISH_TAG" == v* || "$PUBLISH_TAG" == ci-* ]]; then
            TAG_ARGS=(--tag="$PUBLISH_TAG")
          fi
          nix develop --command roc run scripts/ci.roc -- "$MODE" --publish "${TAG_ARGS[@]}"

      - name: Upload bundle-out as workflow artefacts (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-out
          path: bundle-out/
          if-no-files-found: warn
          retention-days: 14
