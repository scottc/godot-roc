name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # --- Roc ---
  ROC_VERSION: nightly-new-compiler
  ROC_NIGHTLY_TAG: nightly-2026-09-18-1d982dc   # update deliberately
  SCRIPT: scripts/ci.roc
  BINARY: bin/ci

  # --- Zig ---
  ZIG_VERSION: "0.16.0"

  # --- Emscripten ---
  EM_VERSION: "3.1.74"          # pin a recent stable; update when needed

  # --- Godot ---
  GODOT_VERSION: "4.7.2-stable" # or whatever you use (must match templates)

jobs:
  full-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false               # if you use LFS for assets

      # ──────────────────────────────────────────────
      # 1. Zig (host.zig unit tests / platform)
      # ──────────────────────────────────────────────
      - name: Setup Zig
        uses: xyzzylabs/setup-zig@v1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: true

      # ──────────────────────────────────────────────
      # 2. Emscripten (emcc + friends)
      # ──────────────────────────────────────────────
      # - name: Setup Emscripten
      #   uses: emscripten-core/setup-emsdk@v16
      #   with:
      #     version: ${{ env.EM_VERSION }}
      #     actions-cache-folder: 'emsdk-cache'  # optional explicit cache dir

      # - name: Verify Emscripten
      #   run: emcc -v

      # ──────────────────────────────────────────────
      # 3. Roc
      # ──────────────────────────────────────────────
      - name: Setup Roc
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: ${{ env.ROC_VERSION }}
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Cache Roc packages + build artifacts
        uses: actions/cache@v6
        with:
          path: ~/.cache/roc
          key: roc-cache-${{ runner.os }}-${{ runner.arch }}-${{ env.ROC_VERSION }}-${{ env.ROC_NIGHTLY_TAG }}-${{ hashFiles('**/*.roc') }}
          restore-keys: |
            roc-cache-${{ runner.os }}-${{ runner.arch }}-${{ env.ROC_VERSION }}-${{ env.ROC_NIGHTLY_TAG }}-
            roc-cache-${{ runner.os }}-${{ runner.arch }}-
      # ──────────────────────────────────────────────
      # 4. Godot (for Web export)
      # ──────────────────────────────────────────────
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false                 # set true if you need C#
          include-templates: true           # required for export

      # Alternative (lighter / Linux-focused):
      # - uses: solarlabyrinth/action-setup-godot@v3
      #   with:
      #     version: ${{ env.GODOT_VERSION }}
      #     export-templates: true

      - name: Verify Godot
        run: godot --version

      # ──────────────────────────────────────────────
      # 5. Build CI Script
      # ──────────────────────────────────────────────
      - name: Cache pre-built Roc script binary
        id: binary-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.BINARY }}
          key: roc-binary-${{ runner.os }}-${{ runner.arch }}-${{ env.ROC_VERSION }}-${{ env.ROC_NIGHTLY_TAG }}-${{ hashFiles(env.SCRIPT, '**/*.roc') }}

      - name: Build Roc script (cache miss only)
        if: steps.binary-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "${{ env.BINARY }}")"
          roc build --opt=speed --output="${{ env.BINARY }}" "${{ env.SCRIPT }}"
          chmod +x "${{ env.BINARY }}"



      # ──────────────────────────────────────────────
      # Your actual pipeline steps
      # ──────────────────────────────────────────────
      # - name: zig build native
      #   run: zig build native

      # Maybe this is a bad idea for CI...
      # As each of the steps are not broken out...
      # But at least we get type checking etc.
      - name: roc run ci.roc
        run: "${{ env.BINARY }}"

      # - name: Build platform / native bits (example)
      #   run: |
      #     # Example: compile something with emcc if needed
      #     emcc ... -o something.js

      # - name: Mock "Publish to Web" (Godot Web export)
      #   run: |
      #     mkdir -p build/web
      #     # Replace "Web" with the exact name of your export preset
      #     godot --headless --path . --export-release "Web" build/web/index.html
      #     # or --export-debug for debug builds

      # - name: Upload Web build artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: web-export
      #     path: build/web
      #     retention-days: 7
