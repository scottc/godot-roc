name: Roc CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # --- Roc ---
  ROC_VERSION: nightly-new-compiler
  ROC_NIGHTLY_TAG: nightly-2026-09-19-d025939   # update deliberately
  SCRIPT: scripts/ci.roc
  BINARY: bin/ci-script

  # --- Zig ---
  ZIG_VERSION: "0.16.0"          # matches current Roc minimum_zig_version

jobs:
  roc:
    runs-on: ubuntu-24.04
    # strategy:
    #   matrix:
    #     os: [ubuntu-24.04, macos-15]
    # runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────
      # Zig (for host.zig unit tests / platform builds)
      # ──────────────────────────────────────────────
      - name: Setup Zig
        uses: mlugg/setup-zig@v2          # or xyzzylabs/setup-zig@v1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: true                 # caches Zig global cache
          # cache-size-limit: 2048        # MiB, default is fine

      # Optional extra cache for Zig packages if you want finer control
      # (setup-zig already caches the global cache, but this can help)
      - name: Cache Zig packages (extra)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            # or ${{ env.ZIG_GLOBAL_CACHE_DIR }} if the action sets it
          key: zig-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-${{ hashFiles('**/build.zig.zon', '**/build.zig') }}
          restore-keys: |
            zig-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-

      # ──────────────────────────────────────────────
      # Roc
      # ──────────────────────────────────────────────
      - name: Setup Roc
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: ${{ env.ROC_VERSION }}
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Cache Roc packages + build artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/roc
          key: roc-cache-${{ runner.os }}-${{ runner.arch }}-${{ env.ROC_VERSION }}-${{ env.ROC_NIGHTLY_TAG }}-${{ hashFiles('**/*.roc') }}
          restore-keys: |
            roc-cache-${{ runner.os }}-${{ runner.arch }}-${{ env.ROC_VERSION }}-${{ env.ROC_NIGHTLY_TAG }}-
            roc-cache-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache pre-built Roc script binary
        id: binary-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BINARY }}
          key: roc-binary-${{ runner.os }}-${{ runner.arch }}-${{ env.ROC_VERSION }}-${{ env.ROC_NIGHTLY_TAG }}-${{ hashFiles(env.SCRIPT, '**/*.roc') }}

      - name: Build Roc script (cache miss only)
        if: steps.binary-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "${{ env.BINARY }}")"
          roc build --optimize "${{ env.SCRIPT }}" -o "${{ env.BINARY }}"

      - name: Make binary executable
        run: chmod +x "${{ env.BINARY }}"

      - name: Run pre-built Roc script
        run: "${{ env.BINARY }}"
